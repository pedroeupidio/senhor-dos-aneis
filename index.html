function regionAt(x,y,board){const rect=board.getBoundingClientRect();if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom)return null;const px=(x-rect.left)/rect.width*360,py=(y-rect.top)/rect.height*330;const within=(cx,cy)=>Math.hypot(px-cx,py-cy)<96;const a=within(132,112),b=within(228,112),c=within(180,200);return (a?'a':'')+(b?'b':'')+(c?'c':'')||'out'}
function boardForPhase(){return $(state.phase==='setup'?'setupBoard':'gameBoard')}
function updateTargets(r){document.querySelectorAll('.zone').forEach(z=>z.classList.toggle('target',!!r&&z.dataset.r===r))}
function renderBoard(id,s){const board=$(id),pending=s.phase==='game'?s.pending:null;for(const z of board.querySelectorAll('.zone')){const r=z.dataset.r;const cards=[...(s.board?.[r]||[])];const showPending=pending&&((correction||pending.region)===r);if(showPending)cards.push(pending.card);z.replaceChildren();z.classList.toggle('empty',!cards.length);z.classList.toggle('pending-zone',!!showPending);const limit=r==='abc'||r==='ab'||r==='ac'||r==='bc'?1:2;const chosen=cards.slice(-limit).reverse();for(const name of chosen){const c=card(name,true);if(showPending&&name===pending.card)c.classList.add('current');z.append(c)}if(cards.length>limit){const n=document.createElement('span');n.className='more';n.textContent='+'+(cards.length-limit);z.append(n)}z.title=labels[r]+' · '+cards.length+' cartas';}}
function render(){const s=state,players=s.players||{},me=players[uid],phase=s.phase||'lobby';show('joinScreen',!me);show('lobbyScreen',!!me&&phase==='lobby');show('setupScreen',!!me&&phase==='setup');show('gameScreen',!!me&&phase==='game');show('endScreen',!!me&&phase==='end');show('rulesIcon',!!me&&master(s)&&phase==='game');if(!me){return}const pos=$('position');if(phase==='lobby'){const list=ordered(s),host=list[0]?.[0]===uid;$('players').replaceChildren();for(const [id,p] of list){const line=document.createElement('div');line.className='player';const text=document.createElement('span');text.textContent=`${p.position} · ${p.name}${id===uid?' (você)':''}${id===s.master?' 👑':''}${online(id)?' 🟢':' ⚪'}`;line.append(text);if(host){const b=document.createElement('button');b.className='small';b.textContent=id===s.master?'Mestre ✓':'Ser mestre';b.disabled=id===s.master;b.onclick=()=>tx(t=>{if(t?.phase!=='lobby'||!t.players?.[id])return;t.master=id;return t});line.append(b)}$('players').append(line)}$('masterInfo').textContent=s.master?'Mestre: '+(players[s.master]?.name||'—'):'Escolham o mestre.';show('startBtn',host&&!!s.master&&list.filter(([id])=>online(id)).length>=2)}
if(phase==='setup'){renderBoard('setupBoard',s);const mine=master(s);$('setupRules').replaceChildren();show('setupRules',mine);if(mine)renderRuleCards($('setupRules'),s.rules);$('setupCards').replaceChildren();if(mine)for(const name of s.starters||[]){const c=card(name);enableDrag(c,name,'setup');$('setupCards').append(c)}$('setupStatus').textContent=mine?'Arraste as 3 cartas':'Aguardando mestre';show('setupDock',mine);$('finishSetup').disabled=!!s.starters?.length}
if(phase==='game'){if(!s.pending)correction=null;const mine=master(s);$('turnInfo').textContent=s.pending?'◌ '+(players[s.pending.player]?.name||'Jogador')+' · mestre':(s.turn===uid?'● Sua vez':'Vez de '+(players[s.turn]?.name||'Jogador'))+(s.turn&&!online(s.turn)?' ○':'');$('counts').replaceChildren();for(const [id,p] of ordered(s)){if(id===s.master)continue;const n=document.createElement('span');n.textContent=p.name+' · '+(s.hands?.[id]?.length??0);$('counts').append(n)}renderBoard('gameBoard',s);show('masterActions',mine&&!!s.pending);if(mine&&s.pending){$('masterHint').textContent=correction&&correction!==s.pending.region?'Confirmar correção':'Aprovar posição';$('approveBtn').title=correction&&correction!==s.pending.region?'Confirmar correção':'Aprovar posição'}show('handDock',!mine);$('hand').replaceChildren();if(!mine){const hand=s.hands?.[uid]||[];$('handCount').textContent='('+hand.length+')';for(const name of hand){const c=card(name);if(s.turn===uid&&!s.pending)enableDrag(c,name,'game');$('hand').append(c)}}}
if(phase==='end'){renderBoard('endBoard',s);$('winnerTitle').textContent='🏆 '+(players[s.winner]?.name||'Jogador')+' venceu!';show('endMasterRules',master(s)&&!s.revealed);if(master(s)&&!s.revealed)renderRuleCards($('endMasterRules'),s.rules);show('revealedRules',!!s.revealed);if(s.revealed)renderRuleCards($('revealedRules'),s.rules);show('revealBtn',master(s)&&!s.revealed)} }
function initializePositions(){const pos=$('position');const selected=pos.value;pos.replaceChildren();for(let i=1;i<=20;i++){const opt=document.createElement('option');opt.value=i;const taken=Object.entries(state.players||{}).find(([id,p])=>id!==uid&&p.position===i);opt.disabled=!!taken;opt.textContent='Posição '+i+(taken?' · ocupada':'');pos.append(opt)}pos.value=pos.querySelector(`option[value="${selected}"]:not(:disabled)`)?.value||[...pos.options].find(o=>!o.disabled)?.value||''}
async function tx(fn){if(locked)return false;locked=true;try{const res=await runTransaction(room,s=>fn(s),{applyLocally:false});if(!res.committed){message('Ação indisponível neste momento.');return false}message('');return true}catch(e){message('Erro: '+e.message);return false}finally{locked=false}}
function enableDrag(el,name,kind){let start=null,timer=null,active=false,last=null;el.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;start={x:e.clientX,y:e.clientY,pointer:e.pointerId};last={x:e.clientX,y:e.clientY};active=false;timer=setTimeout(()=>{if(!start)return;active=true;beginDrag(name,kind,last.x,last.y)},90)});el.addEventListener('pointermove',e=>{if(!start||start.pointer!==e.pointerId)return;last={x:e.clientX,y:e.clientY};if(!active&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>11){clearTimeout(timer);start=null;return}if(active){e.preventDefault();moveDrag(e.clientX,e.clientY)}});const finish=e=>{if(!start)return;clearTimeout(timer);if(active){e.preventDefault();finishDrag(e.clientX,e.clientY);swallowClick=true;setTimeout(()=>swallowClick=false,80)}start=null;active=false};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',()=>{clearTimeout(timer);start=null;active=false;cancelDrag()});el.addEventListener('contextmenu',e=>e.preventDefault())}
function beginDrag(name,kind,x,y){if(drag)return;const ghost=card(name);ghost.classList.add('dragghost');document.body.append(ghost);drag={name,kind,ghost,target:null};moveDrag(x,y);window.addEventListener('pointermove',windowMove,{passive:false});window.addEventListener('pointerup',windowUp,{once:true});window.addEventListener('pointercancel',cancelDrag,{once:true})}
function windowMove(e){if(drag){e.preventDefault();moveDrag(e.clientX,e.clientY)}}
function windowUp(e){if(drag)finishDrag(e.clientX,e.clientY)}
function moveDrag(x,y){if(!drag)return;drag.ghost.style.transform=`translate3d(${x-52}px,${y-125}px,0)`;const board=$(drag.kind==='setup'?'setupBoard':'gameBoard');const r=regionAt(x,y,board);drag.target=r;updateTargets(r)}
function cancelDrag(){if(!drag)return;drag.ghost.remove();drag=null;updateTargets(null);window.removeEventListener('pointermove',windowMove);window.removeEventListener('pointerup',windowUp);window.removeEventListener('pointercancel',cancelDrag)}
async function finishDrag(x,y){if(!drag)return;const {name,kind}=drag;const board=$(kind==='setup'?'setupBoard':'gameBoard');const r=regionAt(x,y,board);cancelDrag();if(!r)return;if(kind==='setup')await tx(s=>{if(s?.phase!=='setup'||s.master!==uid||!s.starters?.includes(name))return;s.board=s.board||{};s.board[r]=s.board[r]||[];s.board[r].push(name);s.starters=s.starters.filter(n=>n!==name);return s});else await tx(s=>{if(s?.phase!=='game'||s.turn!==uid||s.pending||!s.hands?.[uid]?.includes(name))return;s.pending={player:uid,card:name,region:r};return s})}
function openZone(r){const cards=[...(state.board?.[r]||[])];const pending=state.phase==='game'&&state.pending&&(correction||state.pending.region)===r?state.pending:null;if(pending)cards.push(pending.card);$('modalTitle').textContent=labels[r]+' · '+cards.length;$('modalCards').replaceChildren();for(const name of cards.reverse())$('modalCards').append(card(name));if(!cards.length){const p=document.createElement('p');p.className='muted';p.textContent='Nenhuma carta.';$('modalCards').append(p)}show('modalCards',true);show('modalRules',false);show('modal',true)}
function openRules(){renderRuleCards($('modalRules'),state.rules);$('modalTitle').textContent='Regras secretas';show('modalCards',false);show('modalRules',true);show('modal',true)}
function closeModal(){show('modal',false)}
function setupBoardCorrections(){const board=$('gameBoard');let start=null,active=false;board.addEventListener('pointerdown',e=>{if(!master(state)||state.phase!=='game'||!state.pending)return;const r=correction||state.pending.region;const rect=board.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*360,y=(e.clientY-rect.top)/rect.height*330;if(Math.hypot(x-centers[r][0],y-centers[r][1])>45)return;start={x:e.clientX,y:e.clientY,id:e.pointerId};active=false});board.addEventListener('pointermove',e=>{if(!start||e.pointerId!==start.id)return;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>12){active=true;updateTargets(regionAt(e.clientX,e.clientY,board));e.preventDefault()}});board.addEventListener('pointerup',e=>{if(!start)return;if(active){const r=regionAt(e.clientX,e.clientY,board);if(r)correction=r;swallowClick=true;setTimeout(()=>swallowClick=false,80);render()}start=null;active=false;updateTargets(null)});board.addEventListener('pointercancel',()=>{start=null;active=false;updateTargets(null)})}
async function judge(){const correct=correction||state.pending?.region;if(!correct)return;const result=await tx(s=>{if(s?.phase!=='game'||s.master!==uid||!s.pending||!zones.includes(correct))return;const {player,card,region}=s.pending;if(!s.hands?.[player]?.includes(card))return;s.board=s.board||{};s.board[correct]=s.board[correct]||[];s.board[correct].push(card);s.hands[player]=s.hands[player].filter(n=>n!==card);if(correct!==region){if(s.deck?.length)s.hands[player].push(s.deck.shift());s.turn=nextTurn(s,player)}else if(!s.hands[player].length){s.phase='end';s.winner=player}if(!s.hands[player].length&&s.phase==='game'){s.phase='end';s.winner=player}s.pending=null;return s});if(result)correction=null}
$('approveBtn').onclick=judge;
$('menuBtn').onclick=()=>$('manage').classList.toggle('hide');
$('newGameBtn').onclick=async()=>{if(!confirm('Reiniciar a partida para todos?'))return;await tx(s=>({phase:'lobby',players:s?.players||{},master:''}));$('manage').classList.add('hide')};
$('clearBtn').onclick=async()=>{if(!confirm('Encerrar a sala para todos?'))return;await tx(()=>({phase:'lobby',players:{},master:''}));$('manage').classList.add('hide')};
$('skipBtn').onclick=async()=>{if(state.phase!=='game'||online(state.turn)){message('Só é possível pular alguém desconectado durante o jogo.');return}if(!confirm('Pular o jogador desconectado?'))return;await tx(s=>{if(s?.phase!=='game'||online(s.turn))return;if(s.pending?.player===s.turn)s.pending=null;const all=ordered(s).map(([id])=>id).filter(id=>id!==s.master);let idx=all.indexOf(s.turn);for(let i=0;i<all.length;i++){idx=(idx+1)%all.length;if(online(all[idx])){s.turn=all[idx];return s}}});$('manage').classList.add('hide')};
$('joinBtn').onclick=async()=>{const name=$('nick').value.trim(),position=Number($('position').value);if(name.length<2){message('Digite um nome com pelo menos 2 caracteres.');return}await tx(s=>{s=s||{phase:'lobby',players:{}};s.players=s.players||{};if(s.phase!=='lobby'&&!s.players[uid])return;if(Object.entries(s.players).some(([id,p])=>id!==uid&&p.position===position))return;s.players[uid]={name,position};return s})};
$('leaveBtn').onclick=()=>tx(s=>{if(s?.phase!=='lobby'||!s.players?.[uid])return;delete s.players[uid];if(s.master===uid)s.master='';return s});
$('startBtn').onclick=()=>tx(s=>{if(s?.phase!=='lobby'||ordered(s).filter(([id])=>online(id))[0]?.[0]!==uid||!s.master||ordered(s).filter(([id])=>online(id)).length<2)return;const deck=shuffled(names),board=Object.fromEntries(zones.map(z=>[z,[]])),hands={},starters=deck.splice(0,3);for(const [id] of ordered(s))if(id!==s.master)hands[id]=deck.splice(0,5);s.phase='setup';s.starters=starters;s.board=board;s.hands=hands;s.deck=deck;s.rules=[physical[Math.floor(Math.random()*physical.length)],contextual[Math.floor(Math.random()*contextual.length)],linguistic[Math.floor(Math.random()*linguistic.length)]];s.turn=nextTurn(s,s.master);s.pending=null;s.winner=null;s.revealed=false;return s});
$('finishSetup').onclick=()=>tx(s=>{if(s?.phase!=='setup'||s.master!==uid||s.starters?.length)return;s.phase='game';delete s.starters;return s});
$('rulesIcon').onclick=openRules;
$('revealBtn').onclick=()=>tx(s=>{if(s?.phase!=='end'||s.master!==uid)return;s.revealed=true;return s});
$('againBtn').onclick=()=>tx(s=>({phase:'lobby',players:s?.players||{},master:''}));
$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
setupBoardCorrections();
onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;$('connection').textContent='●';onValue(ref(db,'.info/connected'),async snap=>{if(snap.val()){try{const p=ref(db,'presenca/'+uid);await onDisconnect(p).remove();await set(p,true);$('connection').textContent='●'}catch(e){message('Presença: '+e.message)}}else $('connection').textContent='○'});onValue(ref(db,'presenca'),snap=>{presence=snap.val()||{};render()});onValue(room,snap=>{state=snap.val()||{};initializePositions();render()},e=>message('Conexão: '+e.message))});
signInAnonymously(auth).catch(e=>message('Login: '+e.message));
</script></body></html>
